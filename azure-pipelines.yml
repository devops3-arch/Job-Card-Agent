# ── Backend install ──────────────────────────────────────────────────────────
- script: |
    cd backend
    npm install --omit=dev
  displayName: 'Install Backend Production Dependencies'

# Verify node_modules actually exists before zipping
- script: |
    echo "=== Checking node_modules exists ==="
    ls backend/node_modules | wc -l
    echo "=== Checking express exists ==="
    ls backend/node_modules/express
    echo "=== Checking pg exists ==="
    ls backend/node_modules/pg
  displayName: 'Verify node_modules before zip'

# ── Copy frontend dist into backend ─────────────────────────────────────────
- script: |
    cp -r dist backend/dist
    ls backend/dist
  displayName: 'Copy Frontend dist into Backend'

# ── Verify full backend folder before zipping ────────────────────────────────
- script: |
    echo "=== Full backend listing ==="
    ls -la backend/
    echo "=== node_modules size ==="
    du -sh backend/node_modules
  displayName: 'Verify Backend Before Zip'

# ── Package backend as zip ───────────────────────────────────────────────────
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: 'backend'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    replaceExistingArchive: true
  displayName: 'Create Deployment Zip'

# Verify zip contains node_modules
- script: |
    echo "=== Zip size ==="
    du -sh $(Build.ArtifactStagingDirectory)/app.zip
    echo "=== Checking zip contains node_modules ==="
    unzip -l $(Build.ArtifactStagingDirectory)/app.zip | grep "node_modules/express" | head -5
  displayName: 'Verify Zip Contents'