trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  node_version: '22.x'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '$(node_version)'
  displayName: 'Install Node.js'

# ── Frontend build ──────────────────────────────────────────
- script: npm install
  displayName: 'Install frontend dependencies'

- script: npm run build
  displayName: 'Build frontend (Vite)'
  env:
    VITE_API_BASE_URL: 'https://job-card-agent.azurewebsites.net'

# ── Backend install ──────────────────────────────────────────
- script: |
    cd backend
    npm install --production
  displayName: 'Install backend dependencies'

# ── Copy dist into backend for single-zip deploy ────────────
- script: cp -r dist backend/dist
  displayName: 'Copy frontend dist into backend folder'

# ── Package everything ───────────────────────────────────────
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: './backend'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    replaceExistingArchive: true
  displayName: 'Create deployment zip'

- publish: $(Build.ArtifactStagingDirectory)/app.zip
  artifact: production-build
  displayName: 'Publish artifact'

# ── Deploy to Azure App Service ──────────────────────────────
- task: AzureWebApp@1
  inputs:
    azureSubscription: 'job-card-agent-service-connection'   # <-- change this
    appType: webAppLinux
    appName: 'job-card-agent'
    package: '$(Build.ArtifactStagingDirectory)/app.zip'
    runtimeStack: 'NODE|22-lts'
    startUpCommand: 'node server.js'
  displayName: 'Deploy to Azure App Service'