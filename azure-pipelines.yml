# Job Card Agent - Backend Pipeline
# Express.js backend build and publish pipeline
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '22.x'

steps:

# ===============================
# BACKEND - EXPRESS
# ===============================

- task: NodeTool@1
  inputs:
    versionSpec: '$(nodeVersion)'
  displayName: 'Use Node.js 22'

- script: |
    node -v
    npm -v
  displayName: 'Check Node Version'

- script: |
    cd backend
    npm install
  displayName: 'Install Backend Dependencies'

# Optional tests
# - script: |
#     cd backend
#     npm test
#   displayName: 'Run Backend Tests'
#   continueOnError: true

- script: |
    cd backend
    npm run build --if-present
  displayName: 'Build Backend'

- script: |
    cd backend
    npm prune --omit=dev
  displayName: 'Prune Dev Dependencies'

# ===============================
# PUBLISH BUILD
# ===============================

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: 'backend'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
    replaceExistingArchive: true
  displayName: 'Archive Backend'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend.zip'
    ArtifactName: 'backend-build'
    publishLocation: 'Container'
  displayName: 'Publish Backend Artifact'