trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:

# ── Node setup — bypass NodeTool entirely, use nvm directly ─────────────────
- script: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    nvm install 22
    nvm use 22
    nvm alias default 22
    echo "##vso[task.prependpath]$NVM_DIR/versions/node/$(nvm version 22)/bin"
  displayName: 'Install Node.js 22 via nvm'

- script: |
    echo "Node version: $(node -v)"
    echo "npm version: $(npm -v)"
    which node
  displayName: 'Verify Node Version'

# ── Frontend build ───────────────────────────────────────────────────────────
- script: |
    npm install
  displayName: 'Install Frontend Dependencies'

- script: |
    npm run build
  displayName: 'Build Frontend (Vite)'
  env:
    VITE_API_BASE_URL: ''

# ── Test gate ────────────────────────────────────────────────────────────────
# Runs before anything is packaged, so a failing test stops the deploy rather
# than shipping. Covers pricing maths, status transitions, role boundaries and
# the job card validation rules.
- script: |
    npm run test
  displayName: 'Run Tests'

# ── Backend install ──────────────────────────────────────────────────────────
- script: |
    cd backend
    npm install --omit=dev
  displayName: 'Install Backend Production Dependencies'

# ── Database migrations ──────────────────────────────────────────────────────
# Applies pending migrations BEFORE the new code starts serving traffic. This
# matters: the login query selects "AND is_active = true", a column created by
# migration 014, so deploying ahead of the migration breaks every login.
#
# Skipped unless the PROD_DATABASE_URL secret variable is set on the pipeline,
# so adding this step alone changes nothing until you opt in. Set it in
# Pipelines → Edit → Variables, marked as secret.
#
# The runner is idempotent — it records applied files in schema_migrations and
# skips them next time — so re-running is safe. A failure fails the build, which
# is the point: no deploy on top of a half-migrated database.
- script: |
    if [ -z "$PROD_DATABASE_URL" ]; then
      echo "PROD_DATABASE_URL is not set — skipping migrations."
      echo "Migrations must then be applied by hand BEFORE this deploy reaches users."
      exit 0
    fi
    cd backend
    npm run migrate
  displayName: 'Apply Database Migrations'
  env:
    PROD_DATABASE_URL: $(PROD_DATABASE_URL)
    DATABASE_URL: $(PROD_DATABASE_URL)
    # SSL has to be on — Azure Postgres requires secure transport. Two things
    # could turn it on, and it is worth knowing which actually does.
    #
    # PGSSLMODE does not: backend/db.js always passes an explicit `ssl` option
    # to the pg Pool, and pg only falls back to PGSSLMODE when that option is
    # undefined. It used to be set here and was inert.
    #
    # A `?sslmode=require` inside PROD_DATABASE_URL does, and it wins over
    # db.js — pg merges with Object.assign({}, config, parse(connectionString)),
    # so the connection string overrides the `ssl` option db.js chose.
    #
    # Which leaves the case where PROD_DATABASE_URL is set without sslmode. Then
    # db.js decides, and it only enables SSL when NODE_ENV is "production".
    # Setting it here means the step connects either way, and connects the same
    # way the running server does.
    NODE_ENV: production

# ── Clean stale Oryx manifest and verify structure ───────────────────────────
- script: |
    rm -f backend/oryx-manifest.toml
    echo "=== Verifying server.js exists ==="
    ls -la backend/server.js
    echo "=== Verifying package.json exists ==="
    ls -la backend/package.json
    echo "=== Verifying node_modules exists ==="
    du -sh backend/node_modules
  displayName: 'Clean Oryx Manifest and Verify Structure'

# ── Copy frontend dist into backend ─────────────────────────────────────────
- script: |
    cp -r dist backend/dist
    echo "=== dist copied ==="
    ls backend/dist
  displayName: 'Copy Frontend dist into Backend'

# ── Package backend as zip ───────────────────────────────────────────────────
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/backend'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    replaceExistingArchive: true
  displayName: 'Create Deployment Zip'

# ── Verify zip structure ─────────────────────────────────────────────────────
- script: |
    echo "=== Zip size ==="
    du -sh $(Build.ArtifactStagingDirectory)/app.zip
    echo "=== Top-level files in zip ==="
    unzip -l $(Build.ArtifactStagingDirectory)/app.zip | head -30
    echo "=== Checking server.js is at root of zip ==="
    unzip -l $(Build.ArtifactStagingDirectory)/app.zip | grep "server.js"
    echo "=== Checking node_modules/express is in zip ==="
    unzip -l $(Build.ArtifactStagingDirectory)/app.zip | grep "node_modules/express" | head -3
  displayName: 'Verify Zip Structure'

# ── Publish artifact ─────────────────────────────────────────────────────────
- publish: $(Build.ArtifactStagingDirectory)/app.zip
  artifact: production-build
  displayName: 'Publish Artifact'

# ── Deploy to Azure App Service ──────────────────────────────────────────────
- task: AzureWebApp@1
  inputs:
    azureSubscription: 'job-card-agent-service-connection'
    appType: webAppLinux
    appName: 'job-card-agent'
    package: '$(Build.ArtifactStagingDirectory)/app.zip'
    deploymentMethod: zipDeploy
    startUpCommand: 'node server.js'
  displayName: 'Deploy to Azure App Service'